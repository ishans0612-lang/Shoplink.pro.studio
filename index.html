(p.desc||'')}</div><div style="font-size:9px;margin-top:5px;color:${Number(p.stock)>0?'#8ee8bd':'#ffb4ad'};font-weight:800">${Number(p.stock)>0?'IN STOCK · '+Number(p.stock)+' LEFT':'OUT OF STOCK'}</div><div class="price">${money(p.offer||p.price)} ${p.offer?`<span class="old">${money(p.price)}</span>`:''}<div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:7px"><button class="orderbtn" ${Number(p.stock)<=0?'disabled style="opacity:.45;cursor:not-allowed"':''} onclick="event.stopPropagation();addCart(${p.id})">＋ Cart</button><button class="orderbtn" ${Number(p.stock)<=0?'disabled style="opacity:.45;cursor:not-allowed"':''} onclick="event.stopPropagation();addCart(${p.id});openCart()">Order</button><button class="orderbtn slp-love-btn" data-love-id="${p.id}" style="color:${slpIsLoved(p.id)?'#e11d48':'inherit'}" onclick="event.stopPropagation();slpToggleLove(${p.id})">${slpIsLoved(p.id)?'♥ Loved':'♡ Love'}</button></div></div></div></div>`).join('')}</div><div class="customer-empty" style="display:none;text-align:center;padding:22px 8px;color:#a8b8b1;font-size:11px">No matching products. Try another search.</div><div style="font-size:10px;text-align:center;color:#81978f;margin-top:18px">© 2026 ${esc(s.name)}</div><button class="wa" onclick="whatsapp()">☏　Order on WhatsApp</button></div>${slpFloatingHTML('store')}</div><div class="previewhint">Everything you type updates in the live preview. Your store settings are saved on this device.</div>`}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function editor(){let s=state.store;return `<div class="pagehead"><div><h1>Store Editor</h1><div class="sub">Design your storefront and see every change live.</div></div><button class="softbtn" onclick="setPage('store')">↗ Open store</button></div><div class="editor"><section class="controls"><div class="controlscroll"><div class="section"><h3>STORE INFORMATION</h3><label class="field">Store name</label><input class="input" value="${esc(s.name)}" oninput="changeStore('name',this.value)"><label class="field">Tagline</label><input class="input" value="${esc(s.tagline)}" oninput="changeStore('tagline',this.value)"><label class="field">About your shop</label><textarea class="input" rows="2" oninput="changeStore('about',this.value)">${esc(s.about)}</textarea><div class="two"><div><label class="field">Phone</label><input class="input" value="${esc(s.phone)}" oninput="changeStore('phone',this.value)"></div><div><label class="field">WhatsApp number</label><input class="input" value="${esc(s.whatsapp)}" oninput="changeStore('whatsapp',this.value)"></div></div><label class="field">Address</label><input class="input" value="${esc(s.address)}" oninput="changeStore('address',this.value)"><label class="field">Delivery time</label><input class="input" value="${esc(s.delivery)}" oninput="changeStore('delivery',this.value)"></div>
<div class="section"><h3>TEXT COLOR</h3><div class="colorrow"><input type="color" value="${s.textColor}" oninput="tryCustomization('text color',()=>changeStore('textColor',this.value))"><input class="input" value="${s.textColor}" oninput="tryCustomization('text color',()=>changeStore('textColor',this.value))"><span style="font-size:10px;color:#8993a2">Auto</span></div></div>
<div class="section"><h3>BACKGROUND & TEMPLATES</h3><div class="tabs">${['Theme','Templates','Patterns','Solid','Gradient','Image'].map(t=>`<button class="tab ${state.themeTab===t?'active':''}" onclick="state.themeTab='${t}';save();render()">${t}</button>`).join('')}</div>${state.themeTab==='Patterns'?patternsTab():state.themeTab==='Templates'?homeTemplatesTab():state.themeTab==='Solid'?`<div class="swatches">${['#063c30','#111827','#172554','#3f1d38','#fff7ed','#f0fdf4','#ffffff','#0f172a'].map(c=>`<button class="swatch" style="background:${c}" onclick="tryCustomization('solid background',()=>changeStore('bg','${c}'))"></button>`).join('')}</div>`:state.themeTab==='Gradient'?`<div class="swatches">${['linear-gradient(135deg,#064e3b,#0f172a)','linear-gradient(135deg,#0c4a6e,#164e63)','linear-gradient(135deg,#7c2d12,#431407)','linear-gradient(135deg,#312e81,#111827)'].map(c=>`<button class="swatch" style="background:${c}" onclick="tryCustomization('gradient background',()=>changeStore('bg','${c}'))"></button>`).join('')}</div>`:`<button class="softbtn" onclick="tryCustomization('custom background',()=>filePick(v=>changeStore('banner',v)))">＋ Upload background image</button>`}</div>
<div class="section"><h3>MULTI-POSITION PROMOTIONAL BANNERS</h3><p class="sub">Add multiple public image URLs and choose where each banner appears in your customer store.</p><label class="field">Banner image URL (HTTPS)</label><input id="slp-banner-url" class="input" placeholder="https://example.com/banner.jpg"><label class="field">Banner title (optional)</label><input id="slp-banner-title" class="input" placeholder="Festival Sale"><label class="field">Placement</label><select id="slp-banner-position" class="input"><option value="top">Top of store</option><option value="after-categories">After categories</option><option value="before-products">Before products</option></select><button class="softbtn" style="margin-top:8px" onclick="slpAddBanner()">＋ Add banner</button><div id="slp-banner-list" style="margin-top:10px">${slpBannerEditorList()}</div></div><div class="section"><h3>LOGO & HERO IMAGE</h3><label class="field">Store logo</label><div class="uploadline"><input class="input" placeholder="Logo URL" value="${s.logo.startsWith('data:')?'Uploaded image':esc(s.logo)}" onchange="changeStore('logo',this.value)"><button class="uploadbtn" onclick="tryCustomization('logo upload',()=>filePick(v=>changeStore('logo',v)))">▧ Upload</button></div><label class="field">Hero / Banner</label><div class="uploadline"><input class="input" placeholder="Banner URL" value="${s.banner.startsWith('data:')?'Uploaded image':esc(s.banner)}" onchange="changeStore('banner',this.value)"><button class="uploadbtn" onclick="tryCustomization('banner upload',()=>filePick(v=>changeStore('banner',v)))">▧ Upload</button></div></div>
<div class="section"><h3>BUTTONS, SHAPE & SPACING</h3><div class="two"><div><label class="field">Button color</label><input type="color" class="input" value="${s.button}" oninput="tryCustomization('button styling',()=>changeStore('button',this.value))"></div><div><label class="field">Layout</label><select class="input" onchange="changeStore('layout',this.value)"><option value="list" ${s.layout==='list'?'selected':''}>List</option><option value="grid" ${s.layout==='grid'?'selected':''}>Grid</option></select></div></div><label class="field">Announcement bar</label><input class="input" value="${esc(s.announcement)}" oninput="changeStore('announcement',this.value)"></div>
<div class="section"><h3>PRODUCTS (${state.products.length})</h3>${state.products.map((p,i)=>`<div class="productedit"><div class="producttop"><span>ITEM ${i+1}</span><button class="tiny del" onclick="deleteProduct(${p.id})">♧ Delete</button></div><div class="productrow"><img class="thumb" src="${p.image}" onerror="this.style.background='#e8edf2'"><div><input class="miniinput" value="${esc(p.name)}" placeholder="Product name" onchange="editProduct(${p.id},'name',this.value)"><input class="miniinput" type="number" value="${p.price}" placeholder="Price" onchange="editProduct(${p.id},'price',this.value)"></div></div><input class="miniinput" style="margin-top:6px" value="${esc(p.desc)}" placeholder="Description" onchange="editProduct(${p.id},'desc',this.value)"><div class="uploadline"><input class="input" placeholder="Image URL" value="${p.image.startsWith('data:')?'Uploaded image':esc(p.image)}" onchange="editProduct(${p.id},'image',this.value)"><button class="uploadbtn" onclick="filePick(v=>editProduct(${p.id},'image',v))">▧ Upload</button></div><div class="product-actions"><button class="tiny" onclick="filePick(v=>editProduct(${p.id},'image',v))">＋ Change photo</button><button class="tiny" onclick="toast('Gallery slot saved in next update')">＋ Add image</button></div></div>`).join('')}</div>
</div><div class="controlfooter"><button class="addproduct" onclick="addProductModal()">＋　Add Product</button><div style="text-align:center;font-size:10px;color:#a0a9b5;margin-top:9px">${state.products.length} / ${productLimit()} products · ${state.plan} plan</div></div></section><section class="previewarea">${phonePreview()}</section></div>`}
function changeStore(k,v){state.store[k]=v;if(k==='banner')delete state.store.festRef;save();let a=$('.previewarea');if(a)a.innerHTML=phonePreview()}function editProduct(id,k,v){let p=state.products.find(x=>x.id===id);if(p){p[k]=k==='price'?Number(v):v;save();let a=$('.previewarea');if(a)a.innerHTML=phonePreview()}}function deleteProduct(id){if(confirm('Delete this product?')){state.products=state.products.filter(p=>p.id!==id);save();render();toast('Product deleted')}}
function addProductModal(){let limit=productLimit();if(state.products.length>=limit){showUpgrade('More product slots');return}openModal(`<h2>Add a product</h2><label class="field">Product name</label><input id="pn" class="input" placeholder="e.g. Handmade soap"><div class="two"><div><label class="field">Price (₹)</label><input id="pp" type="number" class="input" placeholder="199"></div><div><label class="field">Offer price</label><input id="po" type="number" class="input" placeholder="Optional"></div></div><label class="field">Stock quantity</label><input id="pstock" type="number" min="0" class="input" value="10"><label class="field">Description</label><input id="pd" class="input" placeholder="Short product description"><label class="field">Product photo</label><input id="pi" type="file" accept="image/*" class="input"><div class="modalfoot"><button class="greenbtn" onclick="saveNewProduct()">Save product</button><button class="softbtn" onclick="closeModal()">Cancel</button></div>`)}function saveNewProduct(){let name=$('#pn').value.trim(),price=Number($('#pp').value),file=$('#pi').files[0];if(!name||!price){toast('Enter product name and price');return}let add=image=>{state.products.unshift({id:Date.now(),name,price,offer:Number($('#po').value)||0,stock:Math.max(0,Math.floor(Number($('#pstock').value)||0)),desc:$('#pd').value,category:'General',image:image||'https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=300&q=80'});save();closeModal();render();toast('Product added')};if(file){let r=new FileReader();r.onload=()=>add(r.result);r.readAsDataURL(file)}else add('')}
function dashboard(){return `<div class="pagehead"><div><h1>Welcome back, Ishan</h1><div class="sub">Your store workspace at a glance.</div></div><button class="greenbtn" onclick="setPage('editor')">✎ Customize store</button></div><div class="dashboardgrid"><div class="stat"><small>Total products</small><strong>${state.products.length}</strong></div><div class="stat"><small>Total orders</small><strong>${state.orders.length}</strong></div><div class="stat"><small>Cart items</small><strong>${state.cart.reduce((a,b)=>a+b.qty,0)}</strong></div><div class="stat"><small>Current plan</small><strong style="font-size:19px">${state.plan}</strong></div></div><div class="cards"><div class="card"><h3>Store Editor</h3><p>Customize your store design, products, colors and images with a live mobile preview.</p><button class="greenbtn" onclick="setPage('editor')">Open editor →</button></div><div class="card"><h3>Customer Store</h3><p>See how your products and shop details appear to your customers.</p><button class="softbtn" onclick="setPage('store')">View store →</button></div><div class="card"><h3>Manage Products</h3><p>Add products, change prices and keep your catalog updated.</p><button class="softbtn" onclick="setPage('products')">Manage products →</button></div><div class="card"><h3>Plans & Pricing</h3><p>Compare Simple, Standard and Pro features.</p><button class="softbtn" onclick="setPage('plans')">View plans →</button></div></div>`}
function setStock(id,v){let p=state.products.find(x=>x.id===id);if(!p)return;p.stock=Math.max(0,Math.floor(Number(v)||0));save();render()}function productsPage(){let total=state.products.reduce((a,p)=>a+(Number(p.stock)||0),0),out=state.products.filter(p=>(Number(p.stock)||0)===0).length,low=state.products.filter(p=>(Number(p.stock)||0)>0&&(Number(p.stock)||0)<=5);return `<div class="pagehead"><div><h1>Products & Inventory</h1><div class="sub">Track in-stock, out-of-stock and exact stock counts.</div></div><button class="greenbtn" onclick="addProductModal()">＋ Add product</button></div><div class="dashboardgrid" style="margin-bottom:14px"><div class="stat"><small>Products</small><strong>${state.products.length}</strong></div><div class="stat"><small>Total units in stock</small><strong>${total}</strong></div><div class="stat"><small>Out of stock</small><strong>${out}</strong></div><div class="stat"><small>Low stock (≤5)</small><strong>${low.length}</strong></div></div>${low.length?`<div class="card" style="margin-bottom:14px;border-color:#f5d6a4"><b>Low-stock alert</b><p>${low.map(p=>esc(p.name)+' ('+p.stock+')').join(' · ')}</p></div>`:''}<div class="productgrid">${state.products.map(p=>`<div class="catalogitem"><img src="${p.image}" onerror="this.style.background='#edf1f5'"><div class="info"><b>${esc(p.name)}</b><span class="price">${money(p.offer||p.price)}</span><div class="sub">${esc(p.desc)}</div><div style="margin-top:10px;font-size:11px;font-weight:800;color:${(p.stock||0)>0?'#07845f':'#d14e48'}">${(p.stock||0)>0?'IN STOCK':'OUT OF STOCK'}</div><label class="field">Stock count</label><input class="input" type="number" min="0" value="${Number(p.stock)||0}" onchange="setStock(${p.id},this.value)"><button class="tiny del" style="margin-top:10px" onclick="deleteProduct(${p.id})">Delete product</button></div></div>`).join('')}</div>`}
function filterCustomerStore(input){let root=input.closest('.phoneinner');if(!root)return;let q=(input.value||'').trim().toLowerCase(),cat=root.dataset.activeCategory||'';let visible=0;root.querySelectorAll('.storeproduct').forEach(card=>{let ok=(!q||card.dataset.productName.includes(q)||card.dataset.productCategory.includes(q))&&(!cat||card.dataset.productCategory===cat);card.style.display=ok?'':'none';if(ok)visible++});let count=root.querySelector('.customer-result-count');if(count)count.textContent=visible+' product'+(visible===1?'':'s')+' found';let empty=root.querySelector('.customer-empty');if(empty)empty.style.display=visible?'none':'block'}function filterCustomerCategory(button,category){let root=button.closest('.phoneinner');if(!root)return;root.dataset.activeCategory=(category||'').toLowerCase();root.querySelectorAll('.customer-categories button').forEach(b=>{b.style.background=b===button?'#00c98b':'transparent';b.style.color=b===button?'#052c25':'inherit';b.style.borderColor=b===button?'#00c98b':'#ffffff40'});let search=root.querySelector('.customer-search input');if(search)filterCustomerStore(search);else filterCustomerStore({closest:()=>root,value:''})}
function storePage(){return `${window.CUST_MODE?'':'<div class="pagehead"><div><h1>Customer Store</h1><div class="sub">A preview of the shopping experience.</div></div><button class="softbtn" onclick="setPage(\'editor\')">← Back to editor</button></div>'}<div class="storewrap" style="max-width:520px;margin:auto;${bgStyle(state.store)};padding:15px;border-radius:22px;color:white">${phonePreview().replace(/<div class="previewbar">[\s\S]*?<\/div>/,'').replace(/<div class="phone"[^>]*>/,'<div class="phone" style="width:100%;height:auto;min-height:560px;border:0;border-radius:15px;box-shadow:none;margin:0">')}</div>`}
function updateOrderStatus(id,status){const o=state.orders.find(x=>x.id===id);if(o){o.status=status;save();toast('Order status updated')}}function ordersPage(){return `<div class="pagehead"><div><h1>Orders</h1><div class="sub">Orders are saved in this browser with customer, items, quantity and total.</div></div></div><div class="card">${state.orders.length?state.orders.map(o=>`<div style="padding:12px 0;border-bottom:1px solid var(--line)"><b>${esc(o.id)}</b> · ${esc(o.name)} <span style="float:right;font-weight:800;color:#079b70">${money(o.total)}</span><div class="sub">${esc(o.date)}</div>${(o.items||[]).map(i=>`<div class="sub">${esc(i.name)} x ${i.qty} · ${money(i.price*i.qty)}</div>`).join('')}${o.note?`<div class="sub">Note: ${esc(o.note)}</div>`:''}<div style="margin-top:8px"><label class="field">Order status</label><select class="input" onchange="updateOrderStatus('${o.id}',this.value)"><option ${(!o.status||o.status==='New')?'selected':''}>New</option><option ${o.status==='Processing'?'selected':''}>Processing</option><option ${o.status==='Completed'?'selected':''}>Completed</option><option ${o.status==='Cancelled'?'selected':''}>Cancelled</option></select></div></div>`).join(''):'<p>No orders yet. Tap "＋ Order" in Customer Store, then send the order.</p>'}</div>`}

function analyticsPage(){if(!hasProAccess())return lockedFeaturePage('Business Analytics');const orders=v5Orders(),revenue=orders.reduce((a,o)=>a+Number(o.total||0),0),cost=state.expenses.reduce((a,e)=>a+Number(e.amount||0),0),today=new Date().toLocaleDateString('en-IN'),todayOrders=orders.filter(o=>(o.date||'').startsWith(today)).length;const best={};orders.forEach(o=>(o.items||[]).forEach(i=>best[i.name]=(best[i.name]||0)+Number(i.qty||0)));const top=Object.entries(best).sort((a,b)=>b[1]-a[1]).slice(0,5);return `<div class="pagehead"><div><h1>Business Analytics</h1><div class="sub">Sales and product performance from orders saved on this device.</div></div><button class="softbtn" onclick="exportCSV('orders')">Export orders CSV</button></div><div class="dashboardgrid"><div class="stat"><small>Gross sales</small><strong>${money(revenue)}</strong></div><div class="stat"><small>Orders today</small><strong>${todayOrders}</strong></div><div class="stat"><small>Expenses</small><strong>${money(cost)}</strong></div><div class="stat"><small>Estimated balance</small><strong>${money(revenue-cost)}</strong></div></div><div class="card" style="margin-top:14px"><h3>Best-selling products</h3>${top.length?top.map(([n,q])=>`<p style="display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:7px 0"><b>${esc(n)}</b><span>${q} units</span></p>`).join(''):'<p>No order data yet. Sales insights appear after orders are placed.'}</p></div><p class="sub">These figures are estimates based on locally saved orders; they are not audited accounting records.</p></div>`}

function financePage(){if(!hasProAccess())return lockedFeaturePage('Billing & Finance');const total=state.expenses.reduce((a,e)=>a+Number(e.amount||0),0);return `<div class="pagehead"><div><h1>Billing & Finance</h1><div class="sub">Track business expenses and compare them with saved sales.</div></div><button class="greenbtn" onclick="addExpense()">＋ Add expense</button></div><div class="dashboardgrid"><div class="stat"><small>Sales</small><strong>${money(v5Orders().reduce((a,o)=>a+Number(o.total||0),0))}</strong></div><div class="stat"><small>Expenses</small><strong>${money(total)}</strong></div><div class="stat"><small>Balance estimate</small><strong>${money(v5Orders().reduce((a,o)=>a+Number(o.total||0),0)-total)}</strong></div></div><div class="card" style="margin-top:14px"><h3>Expense records</h3>${state.expenses.length?state.expenses.map(e=>`<p style="display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:8px 0"><span>${esc(e.title)} <small class="sub">${esc(e.date)}</small></span><b>${money(e.amount)}</b></p>`).join(''):'<p>No expenses recorded.'}</p>'}</div><p class="sub">GST-ready invoice generation and verified payment reconciliation require a compliant billing/backend integration; this lightweight V5 keeps expense tracking local.</p>`}
function addExpense(){openModal(`<h2>Add business expense</h2><label class="field">Expense name</label><input id="exname" class="input" placeholder="Packaging, delivery, rent"><label class="field">Amount (₹)</label><input id="examount" class="input" type="number" min="0" placeholder="0"><div class="modalfoot"><button class="greenbtn" onclick="saveExpense()">Save expense</button><button class="softbtn" onclick="closeModal()">Cancel</button></div>`)}function saveExpense(){const title=$('#exname').value.trim(),amount=Number($('#examount').value);if(!title||amount<=0){toast('Enter an expense name and valid amount');return}state.expenses.unshift({id:Date.now(),title,amount,date:new Date().toLocaleDateString('en-IN')});save();closeModal();render();toast('Expense saved')}
function csvCell(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}function downloadText(name,text,type){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([text],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function exportCSV(kind){let rows=kind==='orders'?[['Order ID','Customer','Date','Status','Total'],...state.orders.map(o=>[o.id,o.name,o.date,o.status||'New',o.total])]:[['Customer','Orders','Spent','Last seen'],...state.customers.map(c=>[c.name,c.orders,c.spent,c.lastSeen])];downloadText('shoplink-'+kind+'.csv','\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\n'),'text/csv;charset=utf-8')}

function importProductsCSV(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const lines=String(r.result).split(/\r?\n/).filter(Boolean),parse=line=>line.match(/("(?:[^"]|"")*"|[^,]*)(,|$)/g)?.map(x=>x.replace(/,$/,'').replace(/^"|"$/g,'').replace(/""/g,'"'))||[];const headers=parse(lines.shift()).map(x=>x.trim().toLowerCase());let count=0;lines.forEach(line=>{const vals=parse(line),o={};headers.forEach((h,i)=>o[h]=vals[i]||'');if(o.name&&Number(o.price)>0&&state.products.length+count<productLimit()){state.products.push({id:Date.now()+count,name:o.name,price:Number(o.price),offer:0,stock:Math.max(0,Number(o.stock)||0),category:o.category||'General',desc:o.description||'',image:''});count++}});save();render();toast(count+' products imported'+(state.products.length>=productLimit()?' · plan item limit reached':''))}catch(e){toast('Could not read CSV file')}};r.readAsText(file)}

function saveUPI(){let id=$('#upiid').value.trim(),name=$('#upiname').value.trim();if(!id||!id.includes('@')){toast('Enter a valid UPI ID');return}localStorage.setItem('slp2_upiid',id);localStorage.setItem('slp2_upiname',name||'ShopLink Pro');toast('UPI details saved')}function copyKey(k){navigator.clipboard?.writeText(k).then(()=>toast('Key copied')).catch(()=>toast(k))}function deleteKey(k){state.keys=state.keys.filter(x=>x.key!==k);save();adminPanel()}function makeKey(){let k='SLP-PRO-'+Math.random().toString(36).slice(2,6).toUpperCase();state.keys.push({key:k,used:false,created:Date.now(),months:1});save();adminPanel();toast('1-month Pro key generated')}function redeemKey(){let el=$('#redeemkey'),key=(el?.value||'').trim().toUpperCase(),item=state.keys.find(k=>k.key===key);if(!item){toast('Invalid access key');return}if(item.used){toast('This access key has already been used');return}item.used=true;item.usedAt=Date.now();state.plan='Pro';state.planExpiry=Date.now()+30*24*60*60*1000;save();render();toast('Access key accepted: Pro access enabled for 1 month')}function productLimit(){return state.plan==='Small Business'?50000:state.plan==='Pro'?1000:state.plan==='Standard'?100:10}function showUpgrade(feature){openModal(`<h2><span class="slp-lock-icon">${slpIcon('lock')}</span> ${esc(feature)} is locked</h2><p class="sub">This tool is not included in your ${esc(state.plan)} plan. Upgrade to Standard, Pro or Small Business to unlock more store-building features.</p><div class="card"><b>Simple</b> · 10 products · 1 template<br><b>Standard</b> · 100 products · 20 theme styles<br><b>Pro</b> · 1,000+ products · 100 theme styles<br><b>Small Business</b> · 50,000 products · all Pro features</div><div class="modalfoot"><button class="greenbtn" onclick="closeModal();setPage('plans')">Compare plans</button><button class="softbtn" onclick="closeModal()">Close</button></div>`)}function tryCustomization(feature,action){if(state.plan==='Simple'){showUpgrade(feature);return}action const SHOPLINK_SUPABASE_SQL = `-- ShopLink Pro: secure public storefront + owner write access
-- Your existing public.shops table is reused. Run this migration in Supabase SQL Editor.
alter table public.shops
  add column if not exists owner_id uuid references auth.users(id) on delete cascade;

alter table public.shops enable row level security;

-- Limit anonymous column access to storefront fields only.
revoke all on public.shops from anon, authenticated;
grant select (id, public_data, updated_at) on public.shops to anon, authenticated;
grant insert (id, owner_id, public_data, updated_at) on public.shops to authenticated;
grant update (owner_id, public_data, updated_at) on public.shops to authenticated;
grant delete on public.shops to authenticated;

-- Public storefront data can be read by visitors. Keep customer/private data OUT of public_data.
drop policy if exists "Public can read shops" on public.shops;
create policy "Public can read shops"
  on public.shops for select to anon, authenticated using (true);

-- Only the signed-in shop owner can create, change, or delete their own shop row.
drop policy if exists "Shop owners insert their shops" on public.shops;
create policy "Shop owners insert their shops"
  on public.shops for insert to authenticated
  with check (auth.uid() = owner_id);

drop policy if exists "Shop owners update their shops" on public.shops;
create policy "Shop owners update their shops"
  on public.shops for update to authenticated
  using (auth.uid() = owner_id)
  with check (auth.uid() = owner_id);

drop policy if exists "Shop owners delete their shops" on public.shops;
create policy "Shop owners delete their shops"
  on public.shops for delete to authenticated
  using (auth.uid() = owner_id);
`
async function saveAndTestSupabase(){
 const url=($('#slp-sb-url')?.value||'').trim().replace(/\/$/,'');
 const key=($('#slp-sb-key')?.value||'').trim();
 const status=$('#slp-sb-status');
 if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(url)){toast('Enter a valid Supabase Project URL');return}
 if(!key||key.length<20){toast('Paste your anon / publishable key');return}
 if(/service_role|secret/i.test(key)){toast('Do not use a service_role or secret key');return}if(key.startsWith('sb_secret_')){toast('Secret keys are not safe in browser apps');return}
 status.textContent='Checking Supabase project…';
 try{
  const response=await fetch(url+'/auth/v1/health',{headers:{apikey:key,Authorization:'Bearer '+key}});
  if(!response.ok) throw new Error('HTTP '+response.status);

}

function slpActivatePoster(id){if(!hasProAccess()){closeModal();showSlpPosterLock();return}const t=SLP_POSTER_TEMPLATES.find(x=>x.id===id);if(!t)return;if(slpFloatingList().length>=20){toast('Maximum 20 active floating posters');return}const title=$('#slp-poster-head').value.trim()||t.name,offer=$('#slp-poster-offer').value.trim()||t.offer,page=$('#slp-poster-page').value,position=$('#slp-poster-position').value;state.store.floatingPosters=slpFloatingList();state.store.floatingPosters.push({url:svgURL(slpPosterSVG(t,title,offer)),title,offer,page,position,templateId:id});save();closeModal();render();toast('Poster added to Customer Store')}

function slpAddFloatingPoster(){if(!hasProAccess()){showSlpPosterLock();return}const url=$('#slp-float-url')?.value.trim(),title=$('#slp-float-title')?.value.trim()||'Special offer',page=$('#slp-float-page')?.value||'store',position=$('#slp-float-position')?.value||'right';if(!url||!/^https:\/\//i.test(url)){toast('Enter a public HTTPS image URL');return}if(slpFloatingList().length>=20){toast('Maximum 20 floating posters');return}state.store.floatingPosters=slpFloatingList();state.store.floatingPosters.push({url,title:title.slice(0,45),page,position});save();render();toast('Floating poster saved')}
function slpRemoveFloatingPoster(i){state.store.floatingPosters=slpFloatingList().filter((_,n)=>n!==i);save();render()}
function slpFloatingHTML(page){const matches=slpFloatingList().filter(x=>x&&(x.page==='all'||x.page===page)).slice(0,6);if(!matches.length)return '';return ['left','right'].map(side=>{const group=matches.filter(p=>(p.position||'right')===side).slice(0,3);return group.length?`<div class="slp-float-stack slp-float-stack-${side}">${group.map(p=>`<aside class="slp-float-poster"><button class="slp-float-close" aria-label="Close poster" onclick="this.parentElement.remove()">×</button><img src="${esc(p.url)}" alt="${esc(p.title||'Promotion')}" onerror="this.parentElement.remove()"><div class="slp-float-caption">${esc(p.title||'Special offer')}</div></aside>`).join('')}</div>`:''}).join('')}
function salePage(){const cur=state.store.saleRef,ct=cur&&SALE_TEMPLATES.find(x=>x.id===cur.id),names=['All',...SALE_STYLES.map(x=>x.n)];
 return `<div class="pagehead"><div><h1>Sale Banner Ads</h1><div class="sub">Big shopping-app style sale ads. Everyone can view every design. Adding an ad to your store is a Pro feature, and it shows <b>in addition</b> to your normal banner.</div></div><span class="plan-pill">${SALE_TEMPLATES.length} ADS</span></div>`
 +(ct&&hasProAccess()?`<div class="card" style="margin-bottom:12px"><b>Sale ad on your store now</b><div class="fest-art sale" style="border-radius:12px;margin:10px 0">${saleSVG(ct,{uid:'cur',title:cur.title,offer:cur.offer,discount:cur.discount})}</div><button class="softbtn" onclick="removeSale()">Remove sale ad</button></div>`:'')
 +`<div class="fest-toolbar" style="grid-template-columns:1fr"><select id="sale-filter" class="input" onchange="saleFilter=this.value;filterSale()">${names.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div class="fest-count" id="sale-count">Showing ${SALE_TEMPLATES.length} of ${SALE_TEMPLATES.length} ads</div><div class="fest-grid sale-grid" id="sale-grid">${SALE_TEMPLATES.map(t=>`<article class="fest-card" data-style="${esc(t.style)}"><div class="fest-art sale">${saleSVG(t,{uid:t.id})}</div><div class="fest-card-foot"><div><b>${esc(t.style)}</b><small>${esc(t.palName)}</small></div><button class="softbtn" onclick="openSaleTemplate(${t.id})">${hasProAccess()?'Customize':'View'}</button></div></article>`).join('')}</div>`}
function filterSale(){let n=0;$$('#sale-grid .fest-card').forEach(c=>{const ok=saleFilter==='All'||c.dataset.style===saleFilter;c.style.display=ok?'':'none';if(ok)n++});const el=$('#sale-count');if(el)el.textContent='Showing '+n+' of '+SALE_TEMPLATES.length+' ads'}
function saleVals(){return{title:$('#sale-title').value,offer:$('#sale-offer').value,discount:Math.max(0,Math.min(99999,Number($('#sale-disc').value||0)))}}
function saleLive(id){const t=SALE_TEMPLATES.find(x=>x.id===id),el=$('#sale-live');if(t&&el)el.innerHTML=saleSVG(t,Object.assign({uid:'m'},saleVals()))}
function openSaleTemplate(id){const t=SALE_TEMPLATES.find(x=>x.id===id);if(!t)return;const pro=hasProAccess();
 openModal(`<h2>${esc(t.style)} · ${esc(t.palName)}</h2><div id="sale-live" class="fest-art sale" style="border-radius:12px;margin:10px 0 14px">${saleSVG(t,{uid:'m'})}</div>${pro?'':'<p class="sub" style="color:#b45309"><b>Preview only.</b> You can try the text, but adding this ad to your store needs the Pro plan.</p>'}<label class="field">Headline</label><input id="sale-title" class="input" value="${esc(t.title)}" maxlength="28" oninput="saleLive(${id})"><label class="field">Offer line</label><input id="sale-offer" class="input" value="${esc(t.offer)}" maxlength="44" oninput="saleLive(${id})"><label class="field">Discount number (used by some designs)</label><input id="sale-disc" class="input" type="number" min="0" max="99999" value="${t.disc}" oninput="saleLive(${id})"><div class="modalfoot"><button class="greenbtn" onclick="${pro?`addSale(${id})`:'showSaleLock()'}">${pro?'Add to my store':'Add to my store (Pro)'}</button><button class="softbtn" onclick="closeModal()">Close</button></div>`)}
function addSale(id){if(!hasProAccess()){showSaleLock();return}const t=SALE_TEMPLATES.find(x=>x.id===id);if(!t)return;const v=saleVals();state.store.saleRef={id,title:String(v.title).slice(0,28),offer:String(v.offer).slice(0,44),discount:v.discount};save();closeModal();render();toast('Sale ad added. Your normal banner stays too')}
function removeSale(){delete state.store.saleRef;save();render();toast('Sale ad removed')}
function showSaleLock(){openModal(`<h2>Adding Sale Ads is a Pro feature</h2><p class="sub">You are on the ${esc(state.plan)} plan. Everyone can view the designs, but only Pro shops can add a sale ad to their store.</p><div class="modalfoot"><button class="greenbtn" onclick="closeModal();setPage('plans')">See Pro plan</button><button class="softbtn" onclick="closeModal()">Close</button></div>`)}
function refFest(){const s=state.store;if(!s.banner||!s.festRef)return;const t=FESTIVAL_TEMPLATES.find(x=>x.id===s.festRef[0]);if(!t)return;const d=[t.id,t.headline,t.festival+' Special Offers',t.disc];return s.festRef.every((v,i)=>i===0||v===d[i])?[t.id]:s.festRef}
function refSale(){const r=state.store.saleRef;if(!r||!hasProAccess())return;const t=SALE_TEMPLATES.find(x=>x.id===r.id);if(!t)return;return(r.title===t.title&&r.offer===t.offer&&r.discount===t.disc)?[t.id]:[t.id,r.title,r.offer,r.discount]}

/* ===== Festival Banner Studio: Pro plan only ===== */
function showFestLock(){openModal(`<h2><span class="slp-lock-icon">${slpIcon('lock')}</span> Festival Banner Studio is a Pro feature</h2><p class="sub">You are on the ${esc(state.plan)} plan. Upgrade to Pro to use all ${FESTIVAL_TEMPLATES.length} festival banners.</p><div class="modalfoot"><button class="greenbtn" onclick="closeModal();setPage('plans')">See Pro plan</button><button class="softbtn" onclick="closeModal()">Close</button></div>`)}
function festLockedPage(){const demo=(typeof FESTIVAL_TEMPLATES!=='undefined'?[FESTIVAL_TEMPLATES[1],FESTIVAL_TEMPLATES[10],FESTIVAL_TEMPLATES[22]]:[]).map(t=>`<div style="filter:blur(5px);pointer-events:none;border-radius:14px;overflow:hidden">${festArt(t)}</div>`).join('');return `<div class="pagehead"><div><h1>Festival Banner Studio</h1><div class="sub">Festival banners for Durga Puja, Diwali, Eid, Christmas and more.</div></div><span class="plan-pill">PRO ONLY</span></div><div class="card" style="text-align:center;padding:28px 18px"><div class="lockbig" style="width:54px;height:54px;margin:0 auto 10px;color:#079b70">${slpIcon('lock')}</div><h2 style="margin:6px 0">Festival Banner Studio is only for Pro</h2><p class="sub" style="max-width:420px;margin:0 auto 14px">You are on the ${esc(state.plan)} plan. With Pro you get all ${FESTIVAL_TEMPLATES.length} festival banners, customize them with your own offer and put them on your store in one tap.</p><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:520px;margin:0 auto 16px">${demo}</div><button class="greenbtn" onclick="setPage('plans')">See Pro plan</button></div>`}
/* ===== Cart, WhatsApp order and customer link ===== */
function cartCount(){return state.cart.reduce((a,b)=>a+b.qty,0)}
function cartTotal(){return state.cart.reduce((a,b)=>a+(b.offer||b.price)*b.qty,0)}
function updateCartBar(){const n=cartCount();$$('.wa').forEach(b=>b.textContent=n?`☏　Order on WhatsApp · ${n} item${n>1?'s':''} · ${money(cartTotal())}`:'☏　Order on WhatsApp')}
function addCart(id){const p=state.products.find(x=>x.id===id);if(!p)return;if(Number(p.stock)===0){toast('Out of stock');return}const c=state.cart.find(x=>x.id===id);if(c&&c.qty>=Number(p.stock||0)){toast('Only '+(p.stock||0)+' units available');return}if(c)c.qty++;else state.cart.push({id:p.id,name:p.name,price:p.price,offer:p.offer||0,qty:1});slpSaveCart();save();updateCartBar();toast('Added · '+cartCount()+' item'+(cartCount()>1?'s':'')+' in cart')}
function changeQty(id,d){const c=state.cart.find(x=>x.id===id);if(!c)return;const p=state.products.find(x=>x.id===id);if(d>0&&p&&c.qty>=Number(p.stock||0)){toast('Only '+(p.stock||0)+' units available');return}c.qty+=d;if(c.qty<=0)state.cart=state.cart.filter(x=>x.id!==id);slpSaveCart();save();updateCartBar();openCart()}
function whatsapp(){if(!state.cart.length){toast('Tap ＋ Order on a product first');return}openCart()}
function openCart(){
 if(!state.cart.length){closeModal();return}
 openModal(`${slpFloatingHTML('cart')}<h2>Your order</h2><div>${state.cart.map(c=>`<div style="display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)"><div style="flex:1;min-width:0"><b>${esc(c.name)}</b><div class="sub">${money(c.offer||c.price)} each</div></div><button class="softbtn" onclick="changeQty(${c.id},-1)">−</button><b>${c.qty}</b><button class="softbtn" onclick="changeQty(${c.id},1)">＋</button><b style="min-width:64px;text-align:right">${money((c.offer||c.price)*c.qty)}</b></div>`).join('')}</div><div style="display:flex;justify-content:space-between;padding:12px 0;font-size:16px"><b>Total</b><b>${money(cartTotal())}</b></div><label class="field">Your name</label><input id="cname" class="input" value="${esc(slpProfile().name)}" placeholder="Your name" maxlength="40"><label class="field">Phone number (required)</label><input id="cphone" class="input" type="tel" inputmode="numeric" autocomplete="tel" value="${esc(slpProfile().phone)}" placeholder="Enter phone number" maxlength="15" required><label class="field">Choose saved delivery address</label><select id="slp-checkout-address" class="input" onchange="slpChooseCheckoutAddress()"><option value="">Enter address manually</option>${slpProfile().addresses.map(a=>`<option value="${a.id}">${esc(a.label)} — ${esc(a.address)}</option>`).join('')}</select><label class="field">Delivery address</label><textarea id="cnote" class="input" rows="2" placeholder="Enter full delivery address"></textarea><div class="modalfoot"><button class="greenbtn" onclick="sendOrder()">Send order on WhatsApp</button><button class="softbtn" onclick="closeModal()">Close</button></div>`)}
function slpChooseCheckoutAddress(){const a=slpProfile().addresses.find(x=>String(x.id)===$('#slp-checkout-address')?.value);if(a){$('#cname').value=a.name||'';$('#cphone').value=a.phone||'';$('#cnote').value=a.address||''}}
function waNumber(){let n=String(state.store.whatsapp||state.store.phone||'').replace(/\D/g,'');if(n.length===11&&n[0]==='0')n=n.slice(1);if(n.length===10)n='91'+n;return n}
function sendOrder(){
 const n=waNumber();if(!n){toast('Shop WhatsApp number is missing');return}
 if(!state.cart.length){toast('Cart is empty');return}
 const name=($('#cname').value||'').trim(),phone=($('#cphone').value||'').trim().replace(/[^0-9+]/g,''),note=($('#cnote').value||'').trim();
 if(!note){toast('Choose or enter a delivery address');$('#cnote')?.focus();return}
 if(!phone||phone.replace(/\D/g,'').length<10||phone.replace(/\D/g,'').length>15){toast('Enter a valid phone number to place this order');$('#cphone')?.focus();return}
 const id='SL-'+Math.floor(10000+Math.random()*90000);
 const lines=state.cart.map((c,i)=>`${i+1}. ${c.name} x ${c.qty} = ${money((c.offer||c.price)*c.qty)}`);
 const msg=`*New order - ${state.store.name}*\nOrder no: ${id}\n\n${lines.join('\n')}\n\n*Total: ${money(cartTotal())}*`+(name?`\nName: ${name}`:'')+`\nCustomer phone: ${phone}`+(note?`\nAddress/Note: ${note}`:'');
 window.open('https://wa.me/'+n+'?text='+encodeURIComponent(msg),'_blank');
 const savedItems=state.cart.map(c=>({id:c.id,name:c.name,qty:c.qty,price:c.offer||c.price}));const placed={id,name:name||'Customer',phone,total:cartTotal(),date:new Date().toLocaleString('en-IN'),timestamp:Date.now(),note,status:'WhatsApp order prepared',items:savedItems};if(window.CUST_MODE){const a=slpReadActivity();a.orders=Array.isArray(a.orders)?a.orders:[];a.orders.unshift(placed);slpWriteActivity(a)}else{state.orders.unshift({...placed,status:'New'});let known=state.customers.find(x=>x.name===(name||'Customer'));if(!known)state.customers.push({name:name||'Customer',orders:1,spent:cartTotal(),lastSeen:new Date().toLocaleDateString('en-IN')});else{known.orders=(known.orders||0)+1;known.spent=(known.spent||0)+cartTotal();known.lastSeen=new Date().toLocaleDateString('en-IN')}state.cart.forEach(c=>{let p=state.products.find(x=>x.id===c.id);if(p)p.stock=Math.max(0,(Number(p.stock)||0)-c.qty)})}
 state.cart=[];slpSaveCart();save();updateCartBar();closeModal();toast('Order ready - press Send in WhatsApp')}

/* ===== v5.5: low-credit customer storefront upgrades ===== */
function slpBanners(){return Array.isArray(state.store.banners)?state.store.banners:[]}
function slpBannerEditorList(){return slpBanners().length?slpBanners().map((b,i)=>`<div class="productedit"><div style="display:flex;gap:8px;align-items:center"><img src="${esc(b.url)}" class="thumb" onerror="this.style.opacity='.2'"><div style="flex:1;min-width:0"><b>${esc(b.title||'Store banner')}</b><div class="sub">${esc(b.position||'top')}</div></div><button class="tiny del" onclick="slpRemoveBanner(${i})">Remove</button></div></div>`).join(''):'<p class="sub">No additional banners added yet.</p>'}
function slpAddBanner(){const url=$('#slp-banner-url')?.value.trim(),title=$('#slp-banner-title')?.value.trim()||'Special Offer',position=$('#slp-banner-position')?.value||'top';if(!url||!/^https:\/\//i.test(url)){toast('Enter a public HTTPS banner image URL');return}state.store.banners=slpBanners();state.store.banners.push({url,title:title.slice(0,50),position});save();render();toast('Banner added to store')}
function slpRemoveBanner(i){state.store.banners=slpBanners().filter((_,n)=>n!==i);save();render()}
function slpBannerHTML(position){return slpBanners().filter(b=>b.position===position).map(b=>`<div class="slp-banner" style="background-image:linear-gradient(0deg,#0008,#0001),url('${esc(b.url)}')">${esc(b.title||'')}</div>`).join('')}
function slpProfile(){try{return JSON.parse(localStorage.getItem('slp_customer_profile')||'{"name":"","phone":"","addresses":[]}')}catch{return{name:'',phone:'',addresses:[]}}}
function slpSaveProfile(){const p=slpProfile();p.name=$('#slp-profile-name')?.value.trim()||'';p.phone=$('#slp-profile-phone')?.value.trim()||'';localStorage.setItem('slp_customer_profile',JSON.stringify(p));toast('Profile saved');slpProfileModal()}
function slpAddAddress(){const p=slpProfile(),label=$('#slp-address-label')?.value.trim()||'Address '+(p.addresses.length+1),name=$('#slp-address-name')?.value.trim()||p.name,phone=$('#slp-address-phone')?.value.trim()||p.phone,address=$('#slp-address-text')?.value.trim()||'';if(!address){toast('Enter an address');return}p.addresses.push({id:Date.now(),label,name,phone,address});localStorage.setItem('slp_customer_profile',JSON.stringify(p));slpProfileModal()}
function slpDeleteAddress(id){const p=slpProfile();p.addresses=p.addresses.filter(a=>a.id!==id);localStorage.setItem('slp_customer_profile',JSON.stringify(p));slpProfileModal()}
function slpProfileModal(){const p=slpProfile();openModal(`<h2>Customer Profile</h2><label class="field">Full name</label><input id="slp-profile-name" class="input" value="${esc(p.name)}"><label class="field">Phone number</label><input id="slp-profile-phone" class="input" type="tel" value="${esc(p.phone)}"><button class="greenbtn" style="margin-top:8px" onclick="slpSaveProfile()">Save profile</button><h3 style="margin-top:18px">Saved addresses</h3>${p.addresses.map(a=>`<div class="slp-address"><b>${esc(a.label)}</b><div class="sub">${esc(a.name)} · ${esc(a.phone)}<br>${esc(a.address)}</div><button class="tiny del" onclick="slpDeleteAddress(${a.id})">Delete</button></div>`).join('')||'<p class="sub">No saved addresses yet.</p>'}<h3 style="margin-top:18px">Add new address</h3><label class="field">Address label</label><input id="slp-address-label" class="input" placeholder="Home / Work"><label class="field">Recipient name</label><input id="slp-address-name" class="input" value="${esc(p.name)}"><label class="field">Phone number</label><input id="slp-address-phone" class="input" value="${esc(p.phone)}"><label class="field">Full address</label><textarea id="slp-address-text" class="input" rows="3" placeholder="House, street, area, city, PIN"></textarea><div class="modalfoot"><button class="greenbtn" onclick="slpAddAddress()">Save address</button><button class="softbtn" onclick="closeModal()">Close</button></div>`)}
function slpActivityKey(){const s=state.store||{};return 'slp_customer_'+btoa(unescape(encodeURIComponent(String(s.name||'shop')+'|'+String(s.phone||'')+'|'+location.pathname))).replace(/[^a-z0-9]/gi,'').slice(0,48)}
function slpReadActivity(){try{return JSON.parse(localStorage.getItem(slpActivityKey())||'{}')}catch{return {}}}
function slpWriteActivity(a){localStorage.setItem(slpActivityKey(),JSON.stringify(a||{}))}
function slpLoved(){try{return JSON.parse(localStorage.getItem(window.CUST_MODE?slpActivityKey()+'_wishlist':'slp_wishlist')||'[]')}catch{return[]}}
function slpIsLoved(id){return slpLoved().includes(Number(id))}
function slpToggleLove(id){let a=slpLoved();if(a.includes(Number(id))){a=a.filter(x=>Number(x)!==Number(id));toast('Removed from Wishlist')}else{a.push(Number(id));toast('Added to Wishlist')}localStorage.setItem(window.CUST_MODE?slpActivityKey()+'_wishlist':'slp_wishlist',JSON.stringify(a));document.querySelectorAll('[data-love-id="'+id+'"]').forEach(b=>{b.style.color=a.includes(Number(id))?'#e11d48':'inherit';b.textContent=a.includes(Number(id))?'♥ Loved':'♡ Love'});if(document.getElementById('slp-customer-dashboard'))slpCustomerDashboard();} 
function slpSaveCart(){if(window.CUST_MODE){const a=slpReadActivity();a.cart=state.cart;slpWriteActivity(a)}}
function slpCustomerDashboard(){const a=slpReadActivity(),loved=slpLoved(),orders=Array.isArray(a.orders)?a.orders:[],cart=state.cart||[],items=state.products;const productRow=(p,actions=true)=>`<div class="slp-address" style="display:flex;gap:9px;align-items:center"><img src="${esc(p.image||'')}" style="width:48px;height:48px;object-fit:cover;border-radius:8px" onerror="this.style.display='none'"><div style="flex:1;min-width:0"><b>${esc(p.name)}</b><div class="sub">${money(p.offer||p.price)}</div></div>${actions?`<button class="tiny" onclick="openProduct(${p.id})">View</button>`:''}</div>`;const wish=items.filter(x=>loved.includes(Number(x.id)));const reviewRows=items.flatMap(p=>{try{return JSON.parse(localStorage.getItem('slp_reviews_'+p.id)||'[]').filter(r=>r.name===(slpProfile().name||'Customer')).map(r=>({p,r}))}catch{return[]}});openModal(`<div id="slp-customer-dashboard"><h2>My Activity</h2><div class="slp-store-tools" style="margin:8px 0"><button onclick="slpDashboardTab('cart')">🛒 Cart (${cart.reduce((n,x)=>n+x.qty,0)})</button><button onclick="slpDashboardTab('wishlist')">♥ Wishlist (${wish.length})</button><button onclick="slpDashboardTab('orders')">📦 Orders (${orders.length})</button></div><h3>My Cart</h3>${cart.length?cart.map(c=>`<div class="slp-address"><b>${esc(c.name)}</b><div class="sub">Qty ${c.qty} · ${money((c.offer||c.price)*c.qty)}</div></div>`).join(''):'<p class="sub">Your cart is empty.</p>'}<div class="sub" style="margin:7px 0">Cart total: <b>${money(cart.reduce((n,x)=>n+(x.offer||x.price)*x.qty,0))}</b></div><button class="greenbtn" onclick="closeModal();openCart()">Open Cart</button><h3 style="margin-top:18px">My Wishlist</h3>${wish.length?wish.map(p=>productRow(p)).join(''):'<p class="sub">No saved products yet. Tap the heart on a product to save it.</p>'}<h3 style="margin-top:18px">My Orders</h3>${orders.length?orders.map(o=>`<div class="slp-address"><b>${esc(o.id)}</b><div class="sub">${esc(o.date)} · ${money(o.total)} · ${esc(o.status||'Placed')}</div>${(o.items||[]).map(i=>`<div class="sub">${esc(i.name)} × ${i.qty}</div>`).join('')}</div>`).join(''):'<p class="sub">No orders placed from this device yet.</p>'}<h3 style="margin-top:18px">My Reviews</h3>${reviewRows.length?reviewRows.map(x=>`<div class="slp-address"><b>${esc(x.p.name)} · ${'★'.repeat(x.r.rating||5)}</b><div class="sub">${esc(x.r.text)}</div></div>`).join(''):'<p class="sub">No reviews submitted yet.</p>'}<div class="modalfoot"><button class="softbtn" onclick="closeModal();slpProfileModal()">My Profile</button><button class="softbtn" onclick="closeModal()">Close</button></div></div>`)}

function slpLinkRules(){try{return JSON.parse(localStorage.getItem('slp_link_rules')||'{\"name\":false,\"phone\":false,\"whatsapp\":false,\"product\":false}')}catch{return{name:false,phone:false,whatsapp:false,product:false}}}function saveShopLinkRules(){const r={name:!!$('#link-rule-name')?.checked,phone:!!$('#link-rule-phone')?.checked,whatsapp:!!$('#link-rule-wa')?.checked,product:!!$('#link-rule-product')?.checked};localStorage.setItem('slp_link_rules',JSON.stringify(r));toast('Shop Link requirements saved')}function validateShopLink(){const r=slpLinkRules(),s=state.store;if(r.name&&!String(s.name||'').trim()){toast('Add your Shop Name before creating a link');return false}if(r.phone&&!String(s.phone||'').trim()){toast('Add your Shop Phone before creating a link');return false}if(r.whatsapp&&!String(s.whatsapp||'').trim()){toast('Add your WhatsApp number before creating a link');return false}if(r.product&&!state.products.length){toast('Add at least one product before creating a link');return false}return true}
function b64e(o){const b=new TextEncoder().encode(JSON.stringify(o));let t='';b.forEach(c=>t+=String.fromCharCode(c));return btoa(t).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function b64d(t){t=t.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';const u=Uint8Array.from(atob(t),c=>c.charCodeAt(0));return JSON.parse(new TextDecoder().decode(u))}
function shareBase(){return location.href.split('#')[0].split('?')[0]}
function sharePayload(forQR,k){const s=state.store;const ps=state.products.slice(0,k).map(p=>forQR?[String(p.name).slice(0,40),p.price,p.offer||0,p.category||'General',p.desc||'',/^https:\/\//.test(p.image||'')?p.image:'',Number(p.stock)||0]:[p.name,p.price,p.offer||0,p.category||'General',p.desc||'',/^https:\/\//.test(p.image||'')?p.image:'',Number(p.stock)||0]);return {n:s.name,t:s.tagline,a:s.address,p:s.phone,w:s.whatsapp,b:s.bg,x:s.textColor,l:s.layout,lk:s.look,pt:s.pattern||undefined,bt:s.button,bn:slpBanners().slice(0,8),fp:slpFloatingList().slice(0,20).map(b=>({title:b.title||'Special offer',offer:b.offer||'',page:['store','product','cart','all'].includes(b.page)?b.page:'store',position:b.position==='left'?'left':'right',templateId:Number(b.templateId)||0,url:b.templateId?'':(/^https:\/\//i.test(b.url||'')?b.url:'')})),fr:refFest(),sr:refSale(),P:ps}}
function shareLink(forQR){const base=shareBase();let k=state.products.length;let link=base+'?shop='+b64e(sharePayload(forQR,k));if(forQR)while(k>1&&link.length>850){k--;link=base+'?shop='+b64e(sharePayload(true,k))}return {link,count:k,total:state.products.length}}

function parseCustomerData(d){try{
 if(!d||!Array.isArray(d.P))return null;
 const clip=(t,n)=>String(t==null?'':t).slice(0,n),col=(c,df)=>/^#[0-9a-f]{3,8}$/i.test(c||'')?c:df;
 const letter=n=>'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80"><rect width="80" height="80" fill="#263749"/><text x="50%" y="58%" text-anchor="middle" fill="white" font-size="30" font-family="sans-serif">'+esc((n||'S')[0])+'</text></svg>');
 const store={banners:Array.isArray(d.bn)?d.bn.filter(b=>b&&/^https:\/\//i.test(b.url||'')).slice(0,8):[],floatingPosters:Array.isArray(d.fp)?d.fp.map(b=>{if(!b||!['store','product','cart','all'].includes(b.page))return null;const t=SLP_POSTER_TEMPLATES.find(x=>x.id===Number(b.templateId));const url=t?svgURL(slpPosterSVG(t,String(b.title||t.name).slice(0,45),String(b.offer||t.offer).slice(0,45))):(/^https:\/\//i.test(b.url||'')?b.url:'');return url?{...b,url}:null}).filter(Boolean).slice(0,20):[],name:clip(d.n,60)||'Shop',tagline:clip(d.t,80),address:clip(d.a,120),phone:clip(d.p,20),whatsapp:String(d.w||'').replace(/\D/g,'').slice(0,15),bg:(/^linear-gradient\(\d{1,3}deg,#[0-9a-f]{3,8},#[0-9a-f]{3,8}\)$/i.test(d.b||'')?d.b:col(d.b,'#063c30')),textColor:col(d.x,'#f4f7f6'),layout:d.l==='grid'?'grid':'list',logo:'',banner:'',announcement:''};
 store.look=(typeof d.lk==='number'&&d.lk>=0&&d.lk<=4)?d.lk:'';
 store.pattern=PATTERNS.some(p=>p.k===d.pt)?d.pt:'';
 store.button=col(d.bt,'#00d69a');
 const dn=v=>Math.max(0,Math.min(99999,Number(v)||0)),cl=(v,n)=>v==null?undefined:String(v).slice(0,n);
 if(Array.isArray(d.fr)){const ft=FESTIVAL_TEMPLATES.find(x=>x.id===Number(d.fr[0]));if(ft)store.banner=svgURL(festSVG(ft,{uid:'b',title:cl(d.fr[1],40),offer:cl(d.fr[2],40),discount:d.fr[3]==null?undefined:Math.min(90,dn(d.fr[3]))}))}
 if(Array.isArray(d.sr)){const st=SALE_TEMPLATES.find(x=>x.id===Number(d.sr[0]));if(st)store.saleRef={id:st.id,title:cl(d.sr[1],28),offer:cl(d.sr[2],44),discount:d.sr[3]==null?undefined:dn(d.sr[3])}}
 const products=d.P.slice(0,200).map((p,i)=>({id:i+1,name:clip(p[0],80),price:Math.max(0,Number(p[1])||0),offer:Math.max(0,Number(p[2])||0),category:clip(p[3],30).replace(/['"`<>\\]/g,'')||'General',desc:clip(p[4],160),image:/^https:\/\/[^\s"'<>\\]+$/.test(p[5]||'')?p[5]:letter(p[0]),stock:Math.max(0,Number(p[6])||0)})).filter(p=>p.name&&p.price>0);
 return {store,products}}catch(e){return null}}
function parseCustomer(){const q=new URLSearchParams(location.search).get('shop');if(!q)return null;try{return parseCustomerData(b64d(q))}catch(e){return null}}

function openLogin(reason,after){window.__slpAfterLogin=after||null;const hasCfg=!!sbConfig().url&&!!sbConfig().key;openModal(`<h2>Sign in to ShopLink Pro</h2><p class="sub">Sign in is required to ${esc(reason)}. Opening the app and editing your store does not require login.</p>${hasCfg?'':'<p style="font-size:11px;color:#b45309;background:#fff7e8;padding:10px;border-radius:9px">Google sign-in needs your Supabase Project URL and anon/publishable key in Admin Panel. Configure those first.</p>'}<label class="field">Email</label><input id="auth-email" class="input" type="email" placeholder="you@example.com"><label class="field">Password</label><input id="auth-password" class="input" type="password" placeholder="At least 6 characters"><div class="modalfoot"><button class="greenbtn" onclick="emailAuth('signup')">Create account</button><button class="softbtn" onclick="emailAuth('login')">Sign in</button></div><button class="softbtn" style="width:100%;margin-top:9px" ${hasCfg?'':'disabled'} onclick="googleAuth()">Continue with Google</button><p class="sub" style="margin-top:10px">Your store editor remains available without signing in. Google OAuth must also be enabled in Supabase Authentication settings.</p>`)}
function sbConfig(){let url=localStorage.getItem('slp2_sb_url')||localStorage.getItem('SHOPLINK_SUPABASE_URL')||SLP_PUBLIC_SUPABASE.url;let key=localStorage.getItem('slp2_sb_key')||localStorage.getItem('SHOPLINK_SUPABASE_KEY')||SLP_PUBLIC_SUPABASE.key;url=url.replace(/\/$/,'');if(url&&key){localStorage.setItem('slp2_sb_url',url);localStorage.setItem('slp2_sb_key',key)}return{url,key}}

const SLP_PUBLIC_SUPABASE={url:'https://cqcerbiicrikhcponixh.supabase.co',key:'sb_publishable_ZekVR9WmdZpScErjRFTKGA_WTf4vCyo'};

function slpCloudHeaders(token){const c=slpCloudConfig(),h={'apikey':c.key,'Content-Type':'application/json','Accept':'application/json'};if(token)h.Authorization='Bearer '+token;return h}

async function slpSaveShopToCloud(){
 const session=getSession(),c=slpCloudConfig();
 if(!session?.access_token){window.__slpAfterLogin=()=>{slpSaveShopToCloud().then(copySavedCloudLink).catch(e=>toast(e.message||'Cloud save failed'))};openLogin('save your shop to Cloud Sync',window.__slpAfterLogin);return null}
 const userId=session.user?.id;if(!userId){throw new Error('Your sign-in session has no user ID. Sign out and sign in again.')}
 let id=localStorage.getItem('slp_cloud_shop_id');const previousOwner=localStorage.getItem('slp_cloud_shop_owner');if(!id|| (previousOwner&&previousOwner!==userId)){id=slpNewShopId();localStorage.removeItem('slp_cloud_shop_id')}
 const publicData=sharePayload(false,state.products.length);
 const response=await fetch(c.url+'/rest/v1/shops?on_conflict=id',{method:'POST',headers:{...slpCloudHeaders(session.access_token),'Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({id,owner_id:userId,public_data:publicData,updated_at:new Date().toISOString()})});
 const body=await response.text();if(!response.ok)throw new Error('Cloud save failed ('+response.status+'): '+body.slice(0,240));
